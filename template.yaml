AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Private Alexa skill that queues a Find My sound for each linked user's iPhone.

Parameters:
  AppleId:
    Type: String
    NoEcho: true
    Description: Apple Account email used by the one-time authentication script.
  DeviceName:
    Type: String
    Description: Exact device name shown in Apple Find My.
  SkillId:
    Type: String
    Default: ""
    Description: Alexa skill ID. Leave empty for the first deploy, then redeploy after creating the skill.
  SpokenPhoneName:
    Type: String
    Default: your iPhone
    Description: Name Alexa says after accepting the request.
  FindMyApiBaseUrl:
    Type: String
    Default: ""
    Description: Hosted Device Finder app URL. When set, account-linked Alexa users ring through Cloudflare.
  RunnerApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared bearer token used by the runner to report job status back to Cloudflare.

Conditions:
  HasSkillId: !Not [!Equals [!Ref SkillId, ""]]

Resources:
  SessionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldSessionVersions
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  RingRequestsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  RingRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 300
      MessageRetentionPeriod: 900
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RingRequestsDeadLetterQueue.Arn
        maxReceiveCount: 2

  SetupRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 3600
      MessageRetentionPeriod: 900
      SqsManagedSseEnabled: true

  CloudflareDispatcherUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: SendFindMyJobs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendFindMyJobs
                Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt RingRequestsQueue.Arn
                  - !GetAtt SetupRequestsQueue.Arn

  RingRequestsDeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Find My Alexa requests are waiting in the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RingRequestsDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SkillFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/skill/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 7
      Environment:
        Variables:
          EXPECTED_SKILL_ID: !Ref SkillId
          FIND_MY_API_BASE_URL: !Ref FindMyApiBaseUrl
          PHONE_SPOKEN_NAME: !Ref SpokenPhoneName
          RING_QUEUE_URL: !Ref RingRequestsQueue
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt RingRequestsQueue.QueueName

  SkillFunctionAlexaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      EventSourceToken: !If
        - HasSkillId
        - !Ref SkillId
        - !Ref AWS::NoValue
      FunctionName: !Ref SkillFunction
      Principal: alexa-appkit.amazon.com

  RingWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/worker/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 45
      Environment:
        Variables:
          APPLE_ID: !Ref AppleId
          DEVICE_NAME: !Ref DeviceName
          RUNNER_API_TOKEN: !Ref RunnerApiToken
          SESSION_BUCKET: !Ref SessionBucket
          SESSION_PREFIX: session/
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref SessionBucket
        - S3WritePolicy:
            BucketName: !Ref SessionBucket
        - Statement:
            - Sid: DeleteMigratedLegacySessionObjects
              Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub "${SessionBucket.Arn}/session/*"
      Events:
        RingRequest:
          Type: SQS
          Properties:
            Queue: !GetAtt RingRequestsQueue.Arn
            BatchSize: 1
            Enabled: true

  SetupWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/setup/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 600
      Environment:
        Variables:
          RUNNER_API_TOKEN: !Ref RunnerApiToken
      Policies:
        - S3WritePolicy:
            BucketName: !Ref SessionBucket
        # Adding a device reuses the stored session bundle instead of a fresh Apple sign-in.
        - S3ReadPolicy:
            BucketName: !Ref SessionBucket
      Events:
        SetupRequest:
          Type: SQS
          Properties:
            Queue: !GetAtt SetupRequestsQueue.Arn
            BatchSize: 1
            Enabled: true

Outputs:
  SkillFunctionArn:
    Description: Paste this ARN into the Alexa custom skill endpoint.
    Value: !GetAtt SkillFunction.Arn
  SessionBucketName:
    Description: Passed to scripts/authenticate.py during one-time Apple authentication.
    Value: !Ref SessionBucket
  DeadLetterQueueUrl:
    Description: Failed ring requests appear here for troubleshooting.
    Value: !Ref RingRequestsDeadLetterQueue
  DeadLetterAlarmName:
    Description: Alarm that changes state when a ring request reaches the dead-letter queue.
    Value: !Ref RingRequestsDeadLetterAlarm
  SetupQueueUrl:
    Description: Cloudflare SETUP_QUEUE_URL for phone-based Apple setup.
    Value: !Ref SetupRequestsQueue
  RingQueueUrl:
    Description: Cloudflare RUNNER_QUEUE_URL for ring and health-check jobs.
    Value: !Ref RingRequestsQueue
  CloudflareDispatcherUserName:
    Description: IAM user whose access key is stored only as a Cloudflare Worker secret.
    Value: !Ref CloudflareDispatcherUser
