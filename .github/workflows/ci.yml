name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: "1.164.0"
      - name: Compile Python
        run: python -m compileall -q backend scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate infrastructure
        run: sam validate --lint --template-file template.yaml
      - name: Build deployable artifacts
        run: sam build --template-file template.yaml
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: "24"
      - name: Test the hosted app
        working-directory: hosted
        run: npm ci && npm test
      - name: Validate JSON files
        run: |
          python -m json.tool skill-package/skill.example.json >/dev/null
          python -m json.tool skill-package/interactionModels/custom/en-GB.json >/dev/null
          python -m json.tool skill-package/interactionModels/custom/en-US.json >/dev/null
